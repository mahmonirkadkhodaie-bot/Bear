<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Pediatric Packaging</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      
      #ui-layer {
        position: fixed; bottom: 30px; left: 0; width: 100%;
        display: none !important; justify-content: center; z-index: 99999;
        pointer-events: none;
      }
      #play-btn {
        pointer-events: auto; padding: 15px 40px; background: #ffcc00; color: black;
        font-weight: bold; border: none; border-radius: 30px;
        font-family: Tahoma, sans-serif; font-size: 16px; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    
    <div id="ui-layer">
      <button id="play-btn">شروع ویدیو</button>
    </div>

    <!-- صحنه واقعیت افزوده -->
    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="bear-model" src="bear.glb"></a-asset-item>
        <!-- ویدیو مستقیماً در دارایی‌های سه‌بعدی لود می‌شود -->
        <video id="my-video" src="video2.mp4" playsinline webkit-playsinline crossorigin="anonymous" loop="false"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- مدل خرس -->
        <a-gltf-model id="bear-entity" src="#bear-model" position="0 0.5 0" scale="0.005 0.005 0.005" rotation="0 0 0" animation-mixer></a-gltf-model>
        
        <!-- صفحه نمایش ویدیو (جایگزین کادر سیاه قبلی) - فعلاً مخفی -->
        <!-- ابعاد متناسب با ویدیوی عمودی تنظیم شده است -->
        <a-video id="ar-video-screen" src="#my-video" position="0 0.5 0.1" width="0.6" height="1" visible="false"></a-video>
        
      </a-entity>
      
    </a-scene>

    <script>
      const targetEntity = document.querySelector('[mindar-image-target]');
      const uiLayer = document.querySelector('#ui-layer');
      const playBtn = document.querySelector('#play-btn');
      const video = document.querySelector('#my-video');
      const bear = document.querySelector('#bear-entity');
      const arScreen = document.querySelector('#ar-video-screen');

      // جعبه پیدا شد
      targetEntity.addEventListener("targetFound", () => {
        uiLayer.style.setProperty('display', 'flex', 'important');
      });

      // جعبه گم شد
      targetEntity.addEventListener("targetLost", () => {
        uiLayer.style.setProperty('display', 'none', 'important');
        video.pause();
        // برگرداندن حالت اولیه
        bear.setAttribute('visible', 'true');
        arScreen.setAttribute('visible', 'false');
        playBtn.innerText = "شروع ویدیو";
      });

      // کلیک روی دکمه شروع
      playBtn.addEventListener('click', () => {
        // خرس محو می‌شود و صفحه ویدیو ظاهر می‌شود
        bear.setAttribute('visible', 'false');
        arScreen.setAttribute('visible', 'true');
        
        // پخش ویدیو روی سطح سه‌بعدی
        video.play();
        playBtn.innerText = "در حال پخش...";
      });
    </script>
  </body>
</html>
