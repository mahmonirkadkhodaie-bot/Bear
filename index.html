<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Bear Packaging</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      /* لایه رابط کاربری با قدرت کلیک‌پذیری بالا */
      #ui-layer {
        position: absolute; bottom: 30px; left: 0; width: 100%;
        display: none; justify-content: center; 
        z-index: 99999; /* عدد بسیار بالا برای شکستن شیشه نامرئی */
        pointer-events: none; /* اجازه می‌دهد بقیه صفحه لمس شود */
      }
      #play-btn {
        pointer-events: auto; /* فقط خود دکمه قابلیت کلیک داشته باشد */
        padding: 12px 30px; background: #ffcc00; color: black;
        font-weight: bold; border: none; border-radius: 25px;
        font-family: Tahoma, sans-serif; font-size: 16px; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      #video-container {
        display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); z-index: 999999;
        justify-content: center; align-items: center; flex-direction: column;
      }
      #my-video {
        width: 85%; max-height: 80vh; border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit: cover;
      }
      #close-btn {
        margin-top: 20px; padding: 10px 30px; background: white; color: black;
        font-weight: bold; border: none; border-radius: 20px;
        font-family: Tahoma, sans-serif; cursor: pointer;
      }
    </style>
  </head>
  <body>
    
    <div id="ui-layer">
      <button id="play-btn">شروع ویدیو</button>
    </div>

    <div id="video-container">
      <!-- ویدیو فعلا میوت شده تا باگ مرورگر رو دور بزنیم -->
      <video id="my-video" src="video.mp4" playsinline webkit-playsinline controls preload="auto" muted></video>
      <button id="close-btn">بستن ویدیو</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="bear-model" src="bear.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- سایز خرس روی 0.02 تنظیم شد -->
       <a-gltf-model src="#bear-model" position="0 0.5 0" scale="0.06 0.06 0.06" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const targetEntity = document.querySelector('[mindar-image-target]');
      const uiLayer = document.querySelector('#ui-layer');
      const playBtn = document.querySelector('#play-btn');
      const videoContainer = document.querySelector('#video-container');
      const video = document.querySelector('#my-video');
      const closeBtn = document.querySelector('#close-btn');

      targetEntity.addEventListener("targetFound", () => {
        uiLayer.style.display = 'flex';
      });

      targetEntity.addEventListener("targetLost", () => {
        uiLayer.style.display = 'none';
      });

      playBtn.addEventListener('click', () => {
        videoContainer.style.display = 'flex';
        // اول به ویدیو میگیم لود شو بعد پلی شو
        video.play().catch(function(error) {
          console.log("پخش خودکار توسط مرورگر مسدود شد");
        });
      });

      closeBtn.addEventListener('click', () => {
        videoContainer.style.display = 'none';
        video.pause();
        video.currentTime = 0; 
      });
    </script>
  </body>
</html>
